[project]
name = "friction-marl"
version = "0.1.0"
description = "Control-battery experiments for mixed-motive multi-agent reinforcement learning"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Murad Farzulla", email = "murad@dissensus.ai"}]
dependencies = [
  "torch",
  "gymnasium",
  "numpy",
  "pandas",
  "scipy",
  "matplotlib",
  "seaborn",
  "tqdm",
  "statsmodels",
  "pingouin",
  "scikit-learn",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["friction_marl*"]
